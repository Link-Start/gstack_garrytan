{"on": {workflow_dispatch: {}},permissions: {contents: read},name: CI Throughput Benchmark Paid,concurrency: {group: "ci-throughput-benchmark-paid-${{ github.ref }}",cancel-in-progress: false},env: {IMAGE: "ghcr.io/${{ github.repository }}/ci"},jobs: {build-image: {if: "github.actor != 'dependabot[bot]'",runs-on: ubicloud-standard-8,timeout-minutes: 15,permissions: {contents: read,packages: write},outputs: {image-tag: "${{ steps.meta.outputs.tag }}",runtime-id: "${{ steps.runtime.outputs.id }}"},steps: [{uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1,with: {ref: 6ff884916309e664543aef0155bf3505cb0ac1e3,persist-credentials: false}},{id: meta,run: "echo \"tag=${{ env.IMAGE }}:${{ hashFiles('.github/docker/Dockerfile.ci', 'bun.lock', 'patches/**') }}\" >> \"$GITHUB_OUTPUT\""},{uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f,with: {registry: ghcr.io,username: "${{ github.actor }}",password: "${{ secrets.GITHUB_TOKEN }}"}},{name: Check if image exists,id: check,run: "if docker manifest inspect ${{ steps.meta.outputs.tag }} > /dev/null 2>&1; then\n  echo \"exists=true\" >> \"$GITHUB_OUTPUT\"\nelse\n  echo \"exists=false\" >> \"$GITHUB_OUTPUT\"\nfi\n"},{if: "steps.check.outputs.exists == 'false'",run: cp package.json bun.lock .github/docker/ && cp -R patches .github/docker/patches},{if: "steps.check.outputs.exists == 'false'",uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e},{if: "steps.check.outputs.exists == 'false'",uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a,with: {context: .github/docker,file: .github/docker/Dockerfile.ci,push: "${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}",cache-from: "type=registry,ref=${{ env.IMAGE }}:buildcache",cache-to: "${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && format('type=registry,ref={0}:buildcache,mode=max', env.IM