Sync } from \"node:fs\"; import { execFileSync } from \"node:child_process\";\nimport { cpus,totalmem,arch,release } from \"node:os\";\nconst env=process.env; writeFileSync(env.RUNNER_TEMP+\"/benchmark/provenance.json\", JSON.stringify({\nsourceSha:execFileSync(\"git\",[\"rev-parse\",\"HEAD\"],{encoding:\"utf8\",timeout:5000}).trim(),\nrunId:env.GITHUB_RUN_ID,runAttempt:env.GITHUB_RUN_ATTEMPT,variant:env.BENCH_VARIANT,\nrunner:env.BENCH_RUNNER,jobs:Number(env.BENCH_JOBS),bun:Bun.version,\ncpuModel:cpus()[0]?.model,totalMemoryBytes:totalmem(),architecture:arch(),kernel:release(),\nimage:env.BENCH_IMAGE,runtimeId:env.BENCH_RUNTIME_ID,\nnode:execFileSync(\"node\",[\"--version\"],{encoding:\"utf8\",timeout:5000}).trim(),\npurpose:\"matched-input resource pilot, not release acceptance\"\n},null,2)+\"\\n\");'"},{name: Execute no-cost git and browser launch smoke,env: {PLAYWRIGHT_BROWSERS_PATH: /opt/playwright-browsers},run: "bun -e 'import { rmSync,realpathSync } from \"node:fs\";\nimport { chromium } from \"playwright\";\nimport { createSharedLibsFixture,fixtureGit } from \"./test/helpers/shared-libs-eval-fixture.ts\";\nconst fixture=createSharedLibsFixture(\"ci-smoke\");\ntry {\nif(!/^[a-f0-9]{40}$/.test(fixtureGit(fixture,\"rev-parse\",\"HEAD\")))throw new Error(\"Missing real fixture seed commit\");\nif(realpathSync(fixtureGit(fixture,\"rev-parse\",\"--show-toplevel\"))!==realpathSync(fixture.repo))throw new Error(\"Git fixture escaped its root\");\nif(!realpathSync(fixture.state).startsWith(realpathSync(fixture.root)+\"/\"))throw new Error(\"Fixture state escaped its owner\");\nconst browser=await chromium.launch();\ntry { const page=await browser.newPage();await page.setContent(\"<title>benchmark smoke</title>\");\nif(await page.title()!==\"benchmark smoke\")throw new Error(\"Browser execution failed\"); } finally {await browser.close();}\nconsole.log(\"No-cost native git commit and browser execution passed\");\n} finally {rmSync(fixture.root,{recursive:true,force:t