{"on": {workflow_dispatch: {}},permissions: {contents: read},name: CI Throughput Benchmark Free,concurrency: {group: "ci-throughput-benchmark-free-${{ github.ref }}",cancel-in-progress: false},jobs: {free-benchmark: {runs-on: "${{ matrix.runner }}",timeout-minutes: 90,strategy: {fail-fast: false,max-parallel: 4,matrix: {include: [{name: free-8cpu-2workers,runner: ubicloud-standard-8,jobs: 2},{name: free-8cpu-4workers,runner: ubicloud-standard-8,jobs: 4},{name: free-4cpu-2workers,runner: ubicloud-standard-4,jobs: 2},{name: free-4cpu-4workers,runner: ubicloud-standard-4,jobs: 4}]}},steps: [{uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1,with: {persist-credentials: false,ref: 5a33809b271e3ad7586c471b32b2991ae6a22b90}},{uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6,with: {bun-version: 1.4.0}},{uses: actions/cache@v6,with: {path: ~/.bun/install/cache,key: "linux-bun-${{ hashFiles('bun.lock') }}",restore-keys: "linux-bun-\n"}},{name: Install dependencies,run: bun install --frozen-lockfile},{uses: actions/cache@v6,with: {path: ~/.cache/ms-playwright,key: "linux-playwright-${{ hashFiles('bun.lock') }}",restore-keys: "linux-playwright-\n"}},{name: Install Playwright Chromium,run: npx playwright install --with-deps chromium},{name: Configure the bundled Chromium sandbox helper,run: "set -euo pipefail\nchrome=$(bun -e 'import { chromium } from \"playwright\"; import { realpathSync } from \"node:fs\"; console.log(realpathSync(chromium.executablePath()))')\ncase \"$chrome\" in\n  \"$HOME\"/.cache/ms-playwright/chromium-*/chrome-linux*/chrome) ;;\n  *) echo \"Unexpected Chromium installation path\" >&2; exit 1 ;;\nesac\nhelper=\"${chrome%/*}/chrome_sandbox\"\ninstalled=\"${chrome%/*}/chrome-sandbox\"\ntest -f \"$helper\" && test ! -L \"$helper\"\nsudo install -T -o root -g root -m 4755 \"$helper\" \"$installed\"\ntest \"$(stat -c '%u:%a' \"$installed\")\" = '0:4755'\ncmp -s \"$helper\" \"$installed\"\n"},{name: Install Xvfb + X11 utilities + gate tools,run: sudo apt-get install -y --no-install-recommends xvfb x11-utils poppler-utils fonts-noto-color-emoji},{name: Configure git identity (tests init temp repos),run: "git config --global user.email \"free-tests-ci@gstack.test\"\ngit config --global user.name \"Free Tests CI\"\ngit config --global init.defaultBranch main\n# Some tests run git against the checkout itself; CI checkouts can be\n# owned by a different uid than the runner user.\ngit config --global --add safe.directory '*'\n"},{name: "Generate host SKILL.md outputs (.agents, .factory)",run: bun run gen:skill-docs --host all},{name: Vendor xterm assets into the extension,run: bun run vendor:xterm},{name: Build server-node bundle (loaded by browse cli imports),run: bash browse/scripts/build-node-server.sh},{name: Build gate binaries (make-pdf e2e gates),run: bun run build:gates},{name: Build trusted CSO helper used by free contract tests,run: bun run build:cso},{name: Record exact benchmark provenance,env: {BENCH_VARIANT: "${{ matrix.name }}",BENCH_RUNNER: "${{ matrix.runner }}",BENCH_JOBS: "${{ matrix.jobs }}"},run: "mkdir -p \"$RUNNER_TEMP/benchmark\"\nbun -e 'import { writeFileSync } from \"node:fs\"; import { execFileSync } from \"node:child_process\";\nimport { cpus,totalmem,arch,release } from \"node:os\";\nconst env=process.env; writeFileSync(env.RUNNER_TEMP+\"/benchmark/provenance.json\", JSON.stringify({\nsourceSha:execFileSync(\"git\",[\"rev-parse\",\"HEAD\"],{encoding:\"utf8\",timeout:5000}).trim(),\nrunId:env.GITHUB_RUN_ID,runAttempt:env.GITHUB_RUN_ATTEMPT,variant:env.BENCH_VARIANT,\nrunner:env.BENCH_RUNNER,jobs:Number(env.BENCH_JOBS),bun:Bun.version,\ncpuModel:cpus()[0]?.model,totalMemoryBytes:totalmem(),architecture:arch(),kernel:release(),\nimage:env.BENCH_IMAGE,runtimeId:env.BENCH_RUNTIME_ID,\nnode:execFileSync(\"node\",[\"--version\"],{encoding:\"utf8\",timeout:5000}).trim(),\npurpose:\"matched-input resource pilot, not release acceptance\"\n},null,2)+\"\\n\");'"},{name: Bind complete free inventory and supervision bounds,env: {BENCH_JOBS: "${{ matrix.jobs }}"},run: "bun -e 'import { writeFileSync } from \"node:fs\";\nimport { collectFreeTestFiles,loadFreeTestDurations,packShardsByDuration,TREE_MUTATING,wallTimeoutForPackedShard,wallTimeoutForShard } from \"./scripts/test-free-shards.ts\";\nif(Object.keys(TREE_MUTATING).length)throw new Error(\"Pilot needs an explicit mutator allowance\");\nconst files=collectFreeTestFiles(), durations=loadFreeTestDurations();\nif(!durations)throw new Error(\"Expected committed duration seed\");\nconst plan=packShardsByDuration(files,Number(process.env.BENCH_JOBS),durations);\nconst walls=plan.shards.map((files,i)=>wallTimeoutForPackedShard(plan.predictedMs[i],undefined,files.length));\nconst requiredMs=Math.max(...walls)+wallTimeoutForShard(5)+20*60000;\nif(requiredMs>90*60000)throw new Error(\"Full free census exceeds benchmark job wall\");\nwriteFileSync(process.env.RUNNER_TEMP+\"/benchmark/free-plan.json\",JSON.stringify({files,plan,walls,requiredMs},null,2)+\"\\n\");'"},{name: Run complete free census under measurement,env: {GSTACK_EXPECT_BINARIES: "1",GSTACK_FREE_JOBS: "${{ matrix.jobs }}",GSTACK_FREE_RETRY_FLAKY: "1",GSTACK_FLAKE_LEDGER: "${{ runner.temp }}/benchmark/flake-ledger.jsonl"},run: "set -o pipefail\nbun scripts/ci-resource-metrics.ts --output \"$RUNNER_TEMP/benchmark/resources.json\" --label \"${{ matrix.name }}\" -- xvfb-run -a bun run test:free 2>&1 | tee \"$RUNNER_TEMP/benchmark/free.log\""},{name: Preserve benchmark outcomes,if: always(),uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a,with: {name: "${{ matrix.name }}",path: "${{ runner.temp }}/benchmark",if-no-files-found: error,retention-days: 30}},{name: Preserve failing free shard spools,if: failure(),uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a,with: {name: "${{ matrix.name }}-spools",path: /tmp/gstack-free-test-*.log,if-no-files-found: ignore,retention-days: 30}}]}}}