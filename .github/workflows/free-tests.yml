n},null,2)+\"\\n\");'"},{name: Bind complete free inventory and supervision bounds,env: {BENCH_JOBS: "${{ matrix.jobs }}"},run: "bun -e 'import { writeFileSync } from \"node:fs\";\nimport { collectFreeTestFiles,loadFreeTestDurations,packShardsByDuration,TREE_MUTATING,wallTimeoutForPackedShard,wallTimeoutForShard } from \"./scripts/test-free-shards.ts\";\nif(Object.keys(TREE_MUTATING).length)throw new Error(\"Pilot needs an explicit mutator allowance\");\nconst files=collectFreeTestFiles(), durations=loadFreeTestDurations();\nif(!durations)throw new Error(\"Expected committed duration seed\");\nconst plan=packShardsByDuration(files,Number(process.env.BENCH_JOBS),durations);\nconst walls=plan.shards.map((files,i)=>wallTimeoutForPackedShard(plan.predictedMs[i],undefined,files.length));\nconst requiredMs=Math.max(...walls)+wallTimeoutForShard(5)+20*60000;\nif(requiredMs>90*60000)throw new Error(\"Full free census exceeds benchmark job wall\");\nwriteFileSync(process.env.RUNNER_TEMP+\"/benchmark/free-plan.json\",JSON.stringify({files,plan,walls,requiredMs},null,2)+\"\\n\");'"},{name: Run complete free census under measurement,env: {GSTACK_EXPECT_BINARIES: "1",GSTACK_FREE_JOBS: "${{ matrix.jobs }}",GSTACK_FREE_RETRY_FLAKY: "1",GSTACK_FLAKE_LEDGER: "${{ runner.temp }}/benchmark/flake-ledger.jsonl"},run: "set -o pipefail\nbun scripts/ci-resource-metrics.ts --output \"$RUNNER_TEMP/benchmark/resources.json\" --label \"${{ matrix.name }}\" -- xvfb-run -a bun run test:free 2>&1 | tee \"$RUNNER_TEMP/benchmark/free.log\""},{name: Preserve benchmark outcomes,if: always(),uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a,with: {name: "${{ matrix.name }}",path: "${{ runner.temp }}/benchmark",if-no-files-found: error,retention-days: 30}},{name: Preserve failing free shard spools,if: failure(),uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a,with: {name: "${{ matrix.name }}-spools",path: /tmp/gstack-free-test-*.log,if-no-files-found: ignore,r