ixture failed: \"+result.stderr);\n}\nconst top=spawnSync(\"git\",[\"rev-parse\",\"--show-toplevel\"],{cwd:root,encoding:\"utf8\",timeout:5000});\nif(top.status!==0||realpathSync(top.stdout.trim())!==realpathSync(root))throw new Error(\"Git fixture escaped its root\");\nconst browser=await chromium.launch();\ntry { const page=await browser.newPage();await page.setContent(\"<title>benchmark smoke</title>\");\nif(await page.title()!==\"benchmark smoke\")throw new Error(\"Browser execution failed\"); } finally {await browser.close();}\nconsole.log(\"No-cost native git commit and browser execution passed\");\n} finally {rmSync(root,{recursive:true,force:true});}'"},{name: Record exact benchmark provenance,env: {BENCH_VARIANT: "${{ matrix.name }}",BENCH_RUNNER: "${{ matrix.runner }}",BENCH_JOBS: "${{ matrix.jobs }}",BENCH_IMAGE: "${{ needs.build-image.outputs.image-tag }}",BENCH_RUNTIME_ID: "${{ needs.build-image.outputs.runtime-id }}"},run: "mkdir -p \"$RUNNER_TEMP/benchmark\"\nbun -e 'import { writeFileSync } from \"node:fs\"; import { execFileSync } from \"node:child_process\";\nimport { cpus,totalmem,arch,release } from \"node:os\";\nconst env=process.env; writeFileSync(env.RUNNER_TEMP+\"/benchmark/provenance.json\", JSON.stringify({\nsourceSha:execFileSync(\"git\",[\"rev-parse\",\"HEAD\"],{encoding:\"utf8\",timeout:5000}).trim(),\nrunId:env.GITHUB_RUN_ID,runAttempt:env.GITHUB_RUN_ATTEMPT,variant:env.BENCH_VARIANT,\nrunner:env.BENCH_RUNNER,jobs:Number(env.BENCH_JOBS),bun:Bun.version,\ncpuModel:cpus()[0]?.model,totalMemoryBytes:totalmem(),architecture:arch(),kernel:release(),\nimage:env.BENCH_IMAGE,runtimeId:env.BENCH_RUNTIME_ID,\nnode:execFileSync(\"node\",[\"--version\"],{encoding:\"utf8\",timeout:5000}).trim(),\npurpose:\"matched-input resource pilot, not release acceptance\"\n},null,2)+\"\\n\");'"},{name: Plan the declared live pilot cohort,run: "bun -e 'import { existsSync,writeFileSync } from \"node:fs\";\nimport { buildRunManifest,paidShardWallUpperBoundMs } fr