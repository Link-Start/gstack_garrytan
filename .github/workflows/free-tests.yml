{"on": {workflow_dispatch: {}},permissions: {contents: read},name: CI Throughput Benchmark Free,concurrency: {group: "ci-throughput-benchmark-free-${{ github.ref }}",cancel-in-progress: false},jobs: {cso-race-windows: {runs-on: windows-latest,timeout-minutes: 10,defaults: {run: {shell: bash}},steps: [{uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1,with: {persist-credentials: false,ref: 9fd6971e85fc814e39ee7917168d524145e509f0}},{uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6,with: {bun-version: 1.4.0}},{name: Install helper dependencies,run: bun install --frozen-lockfile --ignore-scripts},{name: Verify native Windows publication recovery and selection,run: "set -o pipefail\nmkdir -p \"$RUNNER_TEMP/cso-race\"\ngit rev-parse HEAD | tee \"$RUNNER_TEMP/cso-race/source.txt\"\nbun --version | tee \"$RUNNER_TEMP/cso-race/bun.txt\"\nbun scripts/test-free-shards.ts --windows-only --list > \"$RUNNER_TEMP/cso-race/selection.txt\"\ngrep -F 'test/cso-publication-recovery-race.test.ts' \"$RUNNER_TEMP/cso-race/selection.txt\"\ntest -f test/cso-publication-recovery-race.test.ts\nbun test test/cso-publication-recovery-race.test.ts 2>&1 | tee \"$RUNNER_TEMP/cso-race/native.log\""},{name: Preserve native Windows results,if: always(),uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a,with: {name: cso-race-windows,path: "${{ runner.temp }}/cso-race",if-no-files-found: error,retention-days: 30}}]}}}